name: Build Android APK (100% Free & Secure)

on:
  # Manual trigger only — will NOT build on regular git pushes
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Install Dependencies
        run: npm ci || npm install

      - name: 5. Verify Static Analysis & Types
        run: |
          npm run lint
          npx tsc --noEmit

      - name: 6. Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: 7. Configure Android Release Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat <<EOF >> android/gradle.properties

          THEDAYAPP_RELEASE_STORE_FILE=release.keystore
          THEDAYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          THEDAYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          THEDAYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "::notice ::No keystore secret provided. Building installable APK with standard test signature."
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: 8. Inject Signing Config into build.gradle
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android/app
        run: |
          node -e '
          const fs = require("fs");
          let gradle = fs.readFileSync("build.gradle", "utf8");
          const signingBlock = `
                  release {
                      storeFile file(THEDAYAPP_RELEASE_STORE_FILE)
                      storePassword THEDAYAPP_RELEASE_STORE_PASSWORD
                      keyAlias THEDAYAPP_RELEASE_KEY_ALIAS
                      keyPassword THEDAYAPP_RELEASE_KEY_PASSWORD
                  }
          `;
          gradle = gradle.replace("signingConfigs {", "signingConfigs {\n" + signingBlock);
          gradle = gradle.replace(/buildTypes\s*{\s*release\s*{/, "buildTypes {\n        release {\n            signingConfig signingConfigs.release");
          fs.writeFileSync("build.gradle", gradle);
          '

      - name: 9. Build Standalone Release APK (.apk)
        working-directory: android
        run: |
          chmod +x gradlew
          echo "Building standalone Release APK with embedded JavaScript bundle..."
          ./gradlew assembleRelease --no-daemon

      - name: 10. Secure Cleanup of Keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: 11. Upload Standalone APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: the-day-app-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

